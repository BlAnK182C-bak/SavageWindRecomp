# Fork test builds for phones: a pushed android-* tag builds the APK (tools/android/build.sh: the NDK r28c, the
# runner's Android SDK and JDK) and attaches it to a prerelease of that tag. No game code inside: players build it on
# their PC from their own game files (tools/android/gamelib.sh).
name: Android APK

on:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: NDK r28c, ninja
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo "a7b54a5de87fecd125a17d54f73c446199e72a64  $RUNNER_TEMP/ndk.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK=$RUNNER_TEMP/android-ndk-r28c" >> "$GITHUB_ENV"
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      # the deps (SDL3, FFmpeg, shaderc: most of the time) saved as soon as they're built, even if a later step fails
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/linux/android/deps
          key: android-deps-${{ hashFiles('tools/linux/build_deps.sh') }}
      - run: tools/linux/build_deps.sh android
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux/android/deps
          key: android-deps-${{ hashFiles('tools/linux/build_deps.sh') }}
      - run: tools/android/build.sh
      - name: Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="build/android/Savage_Wind-$GITHUB_REF_NAME.apk"
          mv build/android/SavageWind-*.apk "$f"
          gh release create "$GITHUB_REF_NAME" "$f" --repo "$GITHUB_REPOSITORY" --prerelease --title "$GITHUB_REF_NAME" \
              --notes "Test build, not an official Savage Wind release: Savage Wind for arm64 Android 13+ (Vulkan 1.3), from this fork at $GITHUB_SHA. No game code inside. On a PC, from a checkout of this tag: \`tools/android/gamelib.sh\` builds the game code from your own game files; copy build/android/swgame.so and swgame.so.id with your exefs and romfs folders into SavageWind/extracted on the phone. A controller is needed to play."
