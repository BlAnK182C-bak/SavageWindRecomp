# Fork test builds for phones: a pushed android-* tag builds the probe app (tools/android_probe/build.sh), which shows
# what a phone has of what the runtime needs, and attaches it to a prerelease of that tag.
name: Android probe

on:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: tools/android_probe/build.sh
      - name: Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="build/android_probe/SavageWind-probe-$GITHUB_REF_NAME.apk"
          mv build/android_probe/SavageWind-probe.apk "$f"
          gh release create "$GITHUB_REF_NAME" "$f" --repo "$GITHUB_REPOSITORY" --prerelease --title "$GITHUB_REF_NAME" \
              --notes "Test build, not an official Savage Wind release: an Android app that checks what a phone has of what Savage Wind's runtime needs (address space, Vulkan 1.3, BC textures, RAM). No game code, nothing to set up: install it, open it, screenshot the report."
